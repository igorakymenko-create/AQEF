name: CTS Harness S0.2 Closure Verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'conformance-tests/harness/s02_harness/closure.py'
      - 'conformance-tests/harness/s02_harness/test_closure.py'
      - '.github/workflows/cts-harness-s02-closure.yml'
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python3 -m pip install 'jsonschema==4.23.0'
      - name: Validate contract package
        run: python3 conformance-tests/harness/tools/validate.py
      - name: Validate validator regression
        run: python3 conformance-tests/harness/tools/test_validate.py
      - name: Run all S0.2 tests including closure
        run: |
          set -o pipefail
          python3 -m unittest discover -s conformance-tests/harness/s02_harness -p 'test_*.py' -v 2>&1 | tee s02-closure-results.txt
      - name: Record immutable commit
        if: always()
        run: |
          printf 'CTS S0.2 closure run SHA: %s\n' "$GITHUB_SHA" | tee s02-closure-commit.txt
          printf '### CTS S0.2 closure verification\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -f s02-closure-results.txt; then tail -n 8 s02-closure-results.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-s02-closure-${{ github.sha }}
          path: |
            s02-closure-results.txt
            s02-closure-commit.txt
          if-no-files-found: warn
