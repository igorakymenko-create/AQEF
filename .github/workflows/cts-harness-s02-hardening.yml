name: CTS Harness S0.2 Hardening
on:
  workflow_dispatch:
  push:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02-hardening.yml'
  pull_request:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02-hardening.yml'
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract schema validator
        run: python3 -m pip install jsonschema==4.23.0
      - name: Validate published contract package
        run: python3 conformance-tests/harness/tools/validate.py
      - name: Regression of validator
        run: python3 conformance-tests/harness/tools/test_validate.py
      - name: Run 54 S0.2 regression and hardening tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover \
            -s conformance-tests/harness/s02_harness \
            -p 'test_*.py' -v 2>&1 | tee s02-hardening-results.txt
      - name: Record run metadata and test summary
        if: always()
        shell: bash
        run: |
          {
            echo '# AQEF S0.2 Hardening evidence'
            echo ''
            echo "Repository commit: \`${GITHUB_SHA}\`"
            echo 'Contract: Harness v0.4; CTS WD7'
            echo ''
            echo '```text'
            if test -f s02-hardening-results.txt; then tail -n 16 s02-hardening-results.txt; else echo 'No test output'; fi
            echo '```'
            echo ''
            echo 'A successful workflow validates the covered S0.2 behavior; it is NOT Stage C exit approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload hardening logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-s02-hardening-${{ github.sha }}
          path: s02-hardening-results.txt
          if-no-files-found: warn
