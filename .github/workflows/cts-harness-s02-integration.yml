name: CTS Harness S0.2 Integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02-integration.yml'
  pull_request:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python3 -m pip install jsonschema==4.23.0
      - name: Validate published Harness Contract package
        run: python3 conformance-tests/harness/tools/validate.py
      - name: Run S0.2 scripted and HTTP integration tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover \
            -s conformance-tests/harness/s02_harness \
            -p 'test_*.py' -v 2>&1 | tee s02-integration-results.txt
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AQEF Stage C / S0.2 HTTP integration'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ''
            if test -f s02-integration-results.txt; then
              echo '```text'
              tail -n 12 s02-integration-results.txt
              echo '```'
            else
              echo 'Test command did not produce output.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-s02-integration-${{ github.sha }}
          path: s02-integration-results.txt
          if-no-files-found: warn
