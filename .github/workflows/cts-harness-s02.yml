name: CTS Harness S0.2 Self-Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02.yml'
  pull_request:
    paths:
      - 'conformance-tests/harness/s02_harness/**'
      - '.github/workflows/cts-harness-s02.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Existing contract package validation
        run: |
          python3 -m pip install jsonschema==4.23.0
          python3 conformance-tests/harness/tools/validate.py

      - name: S0.2 prototype tests
        run: |
          python3 -m unittest discover \
            -s conformance-tests/harness/s02_harness \
            -p 'test_*.py' -v
