name: CTS harness checks

on:
  push:
    paths:
      - "conformance-tests/**"
      - ".github/workflows/cts-harness.yml"
  pull_request:
    paths:
      - "conformance-tests/**"
      - ".github/workflows/cts-harness.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema==4.23.0"
      - name: Package check
        run: python3 conformance-tests/harness/tools/validate.py
      - name: Unit tests
        run: python3 conformance-tests/harness/tools/test_validate.py
