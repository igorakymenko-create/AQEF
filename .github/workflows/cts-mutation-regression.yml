name: CTS Mutation Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conformance-tests/**'
      - '.github/workflows/cts-mutation-regression.yml'

permissions:
  contents: read

jobs:
  mutation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Package validation
        run: python conformance-tests/harness/tools/validate.py

      - name: Existing unit tests
        run: python conformance-tests/harness/tools/test_validate.py

      - name: Independent mutation regression
        id: mutation
        continue-on-error: true
        run: python conformance-tests/harness/tools/aqef_mutation_regression.py .

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('aqef_mutation_results.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# CTS Mutation Regression\n\n')
              f.write(f'- Commit: `{os.environ["GITHUB_SHA"]}`\n')
              if not p.exists():
                  f.write('- **No mutation results produced** (runner did not complete).\n')
              else:
                  data = json.loads(p.read_text(encoding='utf-8'))
                  cases = data['cases']
                  counts = {s: sum(x['status'] == s for x in cases) for s in ('BASELINE_OK','KILLED','SURVIVED','BASELINE_FAILED')}
                  f.write('| Outcome | Count |\n|---|---:|\n')
                  for name, value in counts.items(): f.write(f'| {name} | {value} |\n')
                  f.write('\n| Scenario | Outcome |\n|---|---|\n')
                  for item in cases: f.write(f'| {item["name"]} | {item["status"]} |\n')
          PY

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-mutation-regression-${{ github.sha }}
          path: aqef_mutation_results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce mutation gate
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.mutation.outcome }}' != 'success' ]; then
            echo 'Mutation regression failed (survivor, failed baseline or execution error).'
            exit 1
          fi
          python - <<'PY'
          import json
          with open('aqef_mutation_results.json', encoding='utf-8') as f:
              cases = json.load(f)['cases']
          counts = {k: sum(x['status']==k for x in cases) for k in ('BASELINE_OK','KILLED','SURVIVED','BASELINE_FAILED')}
          assert len(cases) == 26, counts
          assert counts == {'BASELINE_OK':1,'KILLED':25,'SURVIVED':0,'BASELINE_FAILED':0}, counts
          print('Mutation gate passed:', counts)
          PY
