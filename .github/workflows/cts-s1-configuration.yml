name: CTS Stage C S1 Configuration Mock
on:
  workflow_dispatch:
  push:
    paths:
      - 'conformance-tests/s1_configuration/**'
      - '.github/workflows/cts-s1-configuration.yml'
permissions:
  contents: read
jobs:
  s1-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python3 -m pip install jsonschema==4.23.0
      - name: Validate existing contract package
        run: python3 conformance-tests/harness/tools/validate.py
      - name: S1 mock conformance and negative tests
        run: python3 -m unittest discover -s conformance-tests/s1_configuration -p 'test_*.py' -v
      - name: S1 traceable mock outcome
        run: |
          PYTHONPATH=conformance-tests/s1_configuration python3 - <<'PY'
          import json
          from runner import run_suite
          print(json.dumps({'cts_commit':'${{ github.sha }}','mock_result':run_suite(),'broken_mock_result':run_suite('accept_missing_tool_configuration')},indent=2))
          PY
