name: CTS Stage C S1 Fixture and REST
on:
  push:
    paths:
      - 'conformance-tests/s1_configuration/**'
      - '.github/workflows/cts-s1-fixture-rest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s1-rest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published contract validator
        run: python -m pip install 'jsonschema>=4.18' 'referencing>=0.30'
      - name: Validate contract package
        run: python conformance-tests/harness/tools/validate.py
      - name: Regression and new HTTP tests
        run: |
          cd conformance-tests/s1_configuration
          python -m unittest discover -p 'test_*.py' -v
      - name: Print traceable mock results
        run: |
          cd conformance-tests/s1_configuration
          python -c "import json; from s1_rest import run_rest; print(json.dumps({'cts_commit':'${{ github.sha }}','correct_mock':run_rest(),'broken_mock':run_rest('accept_missing_tool_configuration')},indent=2))"
