name: CTS Stage C S1 Negative and Outcomes
on:
  push:
    paths:
      - 'conformance-tests/s1_configuration/**'
      - '.github/workflows/cts-s1-negative-outcomes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s1-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout triggering commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        name: Python 3.12
        with:
          python-version: '3.12'
      - name: Install contract validator
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Validate contract schemas and fixtures
        run: python conformance-tests/harness/tools/validate.py
      - name: Run full S1 regression and negative-outcome suite
        run: |
          cd conformance-tests/s1_configuration
          python -m unittest discover -p 'test_*.py' -v
