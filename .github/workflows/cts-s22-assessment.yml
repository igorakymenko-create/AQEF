name: CTS Stage C S2.2 Assessment Engine
on:
  push:
    paths:
      - 'conformance-tests/s2_assessment/**'
      - '.github/workflows/cts-s22-assessment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Published contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S2.2 Assessment Engine and fault injection
        run: |
          cd conformance-tests/s2_assessment
          python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 Execution regression
        run: |
          cd conformance-tests/s2_execution
          python -m unittest discover -p 'test_*.py' -v
      - name: S1 and S2.0 regression
        run: |
          cd conformance-tests/s1_configuration
          python -m unittest discover -p 'test_*.py' -v
      - name: Traceable CTS mock outcomes
        run: |
          cd conformance-tests/s2_assessment
          python - <<'PY'
          import json,os
          from assessment import run_case
          print(json.dumps({'cts_commit':os.environ['GITHUB_SHA'],
            'scope':'S2.2_MOCK_ONLY',
            'CT-ASM-001':run_case('CT-ASM-001'),
            'CT-ASM-014':run_case('CT-ASM-014'),
            'broken_judge_order':run_case('CT-ASM-001','judge_on_failed_validation'),
            'broken_unavailable':run_case('CT-ASM-014','crash_as_fail')},indent=2))
          PY
