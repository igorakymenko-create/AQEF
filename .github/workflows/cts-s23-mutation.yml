name: CTS Stage C S2.3 Negative and Mutation
on:
  push:
    paths:
      - 'conformance-tests/s2_mutation/**'
      - '.github/workflows/cts-s23-mutation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S2.3 adversarial tests
        run: |
          cd conformance-tests/s2_mutation
          python -m unittest discover -p 'test_*.py' -v
      - name: S2.2 regression
        run: |
          cd conformance-tests/s2_assessment
          python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 regression
        run: |
          cd conformance-tests/s2_execution
          python -m unittest discover -p 'test_*.py' -v
      - name: S1 and S2.0 regression
        run: |
          cd conformance-tests/s1_configuration
          python -m unittest discover -p 'test_*.py' -v
      - name: Traceable S2.3 mutation results
        run: |
          cd conformance-tests/s2_mutation
          python - <<'PY'
          import json,os
          from verification import matrix,closed_absence
          print(json.dumps({'cts_commit':os.environ['GITHUB_SHA'],'results':matrix(),
                            'unclosed':closed_absence(terminal=False),
                            'closed':closed_absence(),
                            'late_call':closed_absence(late=True)},indent=2))
          PY
