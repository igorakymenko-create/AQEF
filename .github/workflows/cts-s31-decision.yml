name: CTS Stage C S3.1 Decision Engine
on:
  push:
    paths:
      - 'conformance-tests/s3_decision/**'
      - '.github/workflows/cts-s31-decision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Published contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S3.0 and S3.1 tests
        run: |
          cd conformance-tests/s3_decision
          python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.3
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.2
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.1
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S1 and S2.0
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable mock outcomes
        run: |
          cd conformance-tests/s3_decision
          python - <<'PY'
          import json,os
          from decision_engine import matrix
          r=matrix()
          assert all(v['outcome']=='PASS' for v in r['good'].values()),r
          assert all(v['outcome']=='FAIL' for v in r['mutants'].values()),r
          print(json.dumps({'cts_commit':os.environ['GITHUB_SHA'],**r},indent=2))
          PY
