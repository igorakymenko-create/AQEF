name: CTS Stage C S3.5.0 Unified Pipeline
on:
  push:
    paths:
      - 'conformance-tests/s35_integration/**'
      - '.github/workflows/cts-s350-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Validate published schemas
        run: python conformance-tests/harness/tools/validate.py
      - name: S3.5.0 integrated CTS mock tests
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: S3.2 regression
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S3.0 and S3.1 regression
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: S2.3 regression
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S2.2 regression
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 regression
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: S1 and S2.0 regression
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable unified outcomes
        run: |
          cd conformance-tests/s35_integration
          python - <<'PY'
          import json, os
          from pipeline import run_case, PROFILES
          good={p:run_case(p) for p in PROFILES}
          mutants={
            'failed_attempt_as_execution':run_case('retry','record_failed_attempt'),
            'conversation_tamper':run_case('healthy','alter_conversation'),
            'judge_on_validation_failure':run_case('validation_fail','judge_after_validation_failure'),
            'validator_crash_misclassified':run_case('validator_crash','crash_as_fail'),
            'inconclusive_gate_pass':run_case('inconclusive','allow_bad_gate'),
          }
          assert all(v['outcome']=='PASS' for v in good.values()),good
          assert all(v['outcome']=='FAIL' for v in mutants.values()),mutants
          print(json.dumps({'cts_commit':os.environ['GITHUB_SHA'],'scope':'S3.5.0_UNIFIED_MOCK_ONLY',
               'correct':good,'mutants':mutants,
               'tampered_evidence':run_case('healthy',damage=True),
               'unclosed_observation':run_case('healthy',terminal_observed=False)},indent=2))
          PY
