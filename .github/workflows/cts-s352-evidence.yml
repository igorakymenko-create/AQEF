name: CTS Stage C S3.5.2 Persistent Evidence
on:
  push:
    paths:
      - 'conformance-tests/s35_evidence/**'
      - '.github/workflows/cts-s352-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Published contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S3.5.2 persistent evidence tests
        run: cd conformance-tests/s35_evidence && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.1 governance regression
        run: cd conformance-tests/s35_resolution && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.0 integration regression
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: S3.2 mutation regression
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S3.0 and S3.1 regression
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: S2.3 regression
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S2.2 regression
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 regression
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: S1 and S2.0 regression
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable persistent evidence verdicts
        run: |
          cd conformance-tests/s35_evidence
          python - <<'PY'
          import json,os,pathlib,tempfile
          from evidence import EvidenceStore,EvidenceResolver,produce_integrated_evidence,assess_integrated_snapshot
          with tempfile.TemporaryDirectory() as directory:
              store=EvidenceStore(directory)
              fx=produce_integrated_evidence(store,run_id='run-trace',case_id='CT-DEC-006',correlation_id='corr-trace')
              resolver=EvidenceResolver(directory)
              def check():return assess_integrated_snapshot(fx['execution_id'],fx['receipts'],resolver,
                       run_id='run-trace',case_id='CT-DEC-006',correlation_id='corr-trace')
              valid=check()
              assert valid['outcome']=='PASS',valid
              ref=fx['receipts']['redacted']['ref'].split('://')[1]
              path=pathlib.Path(directory)/'objects'/ref
              path.write_bytes(path.read_bytes()+b'!')
              tampered=check()
              assert tampered['outcome']=='NOT_RUN',tampered
              print(json.dumps({'cts_commit':os.environ['GITHUB_SHA'],
                'scope':'S3.5.2_PERSISTENT_MOCK_ONLY',
                'persisted_verified':{k:v for k,v in valid.items() if k!='data'},
                'tampered_redacted':tampered},indent=2))
          PY
