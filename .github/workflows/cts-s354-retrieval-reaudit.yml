name: CTS Stage C S3.5.4 Attribution Retrieval Re-Audit
on:
  push:
    paths:
      - 'conformance-tests/s35_attribution/**'
      - '.github/workflows/cts-s354-retrieval-reaudit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Validate published schemas
        run: python conformance-tests/harness/tools/validate.py
      - name: S3.5.4 HTTP Retrieval and independent predicates
        run: cd conformance-tests/s35_attribution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.3 timing
        run: cd conformance-tests/s35_timing && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.2 evidence
        run: cd conformance-tests/s35_evidence && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.1 governance
        run: cd conformance-tests/s35_resolution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.0 integration
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.2 mutation
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.0 and S3.1
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.3
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.2
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.1
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S1 and S2.0
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable Q-02 Q-08 readback and re-audit
        run: |
          cd conformance-tests/s35_attribution
          python - <<'PY'
          import json,os
          from retrieval import service,exchange,readback
          from predicates import Q08,PATHS,all_of
          from audit import summarize
          sid='s354-trace';run='run-s354-trace';case='CT-DEC-012'
          with service(judge='J-PASS-60') as (server,store):
              e=readback(exchange(server,'execute',sid,run,case,suite='cts-suite',environment='cts-env'),store)
              assert e['outcome']=='PASS',e
              xid=e['body']['execution_ids'][0]
              results=readback(exchange(server,'get_results',sid,run,case,execution_id=xid),store)
              assert results['outcome']=='PASS',results
              q08=all_of(results['body'],Q08['CT-DEC-012:get_results'])
              assert q08['outcome']=='PASS',q08
              g=readback(exchange(server,'evaluate_gates',sid,run,case,batch_id=xid),store)
              assert g['outcome']=='PASS',g
              decision=all_of(g['body'],Q08['CT-DEC-006:evaluate_gates'])
              assert decision['outcome']=='PASS',decision
              audit=summarize()
              assert audit['real_sut_conformance'] is False
              assert audit['unconditional_exit_acceptance'] is False
              summary={'cts_commit':os.environ['GITHUB_SHA'],'scope':'S3.5.4_HTTP_MOCK_ONLY',
                'http_readback':'PASS','q02_mapped_paths':len(PATHS),
                'q08_case_profiles':list(Q08),'q08_results':q08['outcome'],
                'q08_gate':decision['outcome'],'reaudit_register':audit}
              print(json.dumps(summary,indent=2))
          PY
