name: CTS Stage C S3.5.5 Q-05 Closure
on:
  push:
    paths:
      - 'conformance-tests/s355_closure/**'
      - 'conformance-tests/s2_assessment/assessment.py'
      - 'conformance-tests/s3_mutation/verification.py'
      - 'conformance-tests/s35_integration/pipeline.py'
      - '.github/workflows/cts-s355-q05-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Contract schemas
        run: python conformance-tests/harness/tools/validate.py
      - name: Q-05 closure tests and static enforcement
        run: cd conformance-tests/s355_closure && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.4 regression
        run: cd conformance-tests/s35_attribution && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.3 regression
        run: cd conformance-tests/s35_timing && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.2 regression
        run: cd conformance-tests/s35_evidence && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.1 regression
        run: cd conformance-tests/s35_resolution && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.0 regression
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: S3.2 regression
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S3.0 S3.1 regression
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: S2.3 regression
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S2.2 regression
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 regression
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: S1 S2.0 regression
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable measured Q-05 closure
        run: |
          cd conformance-tests/s355_closure
          python - <<'PY'
          import json, os, sys, pathlib
          root=pathlib.Path.cwd().parent
          for name in ('s3_mutation','s2_assessment','s35_integration'):
              sys.path.insert(0,str(root/name))
          from observation import local_profile
          from verification import negative_observation
          from assessment import run_case as assess
          from pipeline import run_case as integrated
          p=local_profile()
          evidence={'cts_commit':os.environ['GITHUB_SHA'],
             'scope':'S3.5.5_MEASURED_MOCK_ONLY',
             'calibration':p,
             's32_negative':negative_observation()['outcome'],
             's32_late':negative_observation(late=True)['outcome'],
             's22_validator_crash':assess('CT-ASM-014')['outcome'],
             's350_validator_crash':integrated('validator_crash')['outcome']}
          assert evidence['s32_negative']=='PASS'
          assert evidence['s32_late']=='FAIL'
          assert evidence['s22_validator_crash']=='PASS'
          assert evidence['s350_validator_crash']=='PASS'
          assert p['drain_ms']>0
          print(json.dumps(evidence,indent=2))
          PY
