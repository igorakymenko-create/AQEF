name: CTS Stage C S4.0 Human Review Timeout
on:
  push:
    paths:
      - 'conformance-tests/s4_human_review/**'
      - '.github/workflows/cts-s40-human-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Published contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S4.0 CT-HRV-003 tests
        run: cd conformance-tests/s4_human_review && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.5 Q-05 closure regression
        run: cd conformance-tests/s355_closure && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.4 retrieval regression
        run: cd conformance-tests/s35_attribution && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.3 timing regression
        run: cd conformance-tests/s35_timing && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.2 evidence regression
        run: cd conformance-tests/s35_evidence && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.1 governance regression
        run: cd conformance-tests/s35_resolution && python -m unittest discover -p 'test_*.py' -v
      - name: S3.5.0 integrated regression
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: S3.2 mutation regression
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S3.0 S3.1 decision regression
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: S2.3 mutation regression
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: S2.2 assessment regression
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: S2.1 execution regression
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: S1 S2.0 regression
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Traceable CT-HRV-003 verdicts
        run: |
          cd conformance-tests/s4_human_review
          python - <<'PY'
          import json,os
          from human_review import run_ct_hrv_003
          results={
              'healthy':run_ct_hrv_003(),
              'silent_pass_mutant':run_ct_hrv_003(mutation='silent_pass'),
              'missing_timeout_mutant':run_ct_hrv_003(mutation='missing_timeout_event',budget_ms=40),
              'unclaimed_capability':run_ct_hrv_003(claims=False),
          }
          expected={'healthy':'PASS','silent_pass_mutant':'FAIL',
                    'missing_timeout_mutant':'NOT_RUN','unclaimed_capability':'NOT_APPLICABLE'}
          assert all(results[k]['outcome']==v for k,v in expected.items()),results
          summary={'cts_commit':os.environ['GITHUB_SHA'],
                   'scope':'S4.0_CT_HRV_003_MOCK_ONLY',
                   'method':'AUTOMATED_NO_HUMAN_REVIEW_SUBMITTED',
                   'outcomes':{k:results[k] for k in expected}}
          print(json.dumps(summary,indent=2))
          PY
