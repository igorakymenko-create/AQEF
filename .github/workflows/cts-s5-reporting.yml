name: CTS Stage C S5 Reporting Integrity
on:
  push:
    paths:
      - 'conformance-tests/s5_reporting/**'
      - '.github/workflows/cts-s5-reporting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30'
      - name: Published contract validation
        run: python conformance-tests/harness/tools/validate.py
      - name: S5 Reporting integrity tests
        run: cd conformance-tests/s5_reporting && python -m unittest discover -p 'test_*.py' -v
      - name: Generate actual partial mock CTS report
        run: |
          python conformance-tests/s5_reporting/reporting.py \
            --out "$RUNNER_TEMP/aqef-s5-report" --commit "$GITHUB_SHA" \
            --claims 'cli,plugins:validator,human_review'
          python conformance-tests/harness/tools/validate.py \
            --report "$RUNNER_TEMP/aqef-s5-report/report.json" \
            --manifest "$RUNNER_TEMP/aqef-s5-report/manifest.json" \
            --evidence-root "$RUNNER_TEMP/aqef-s5-report/evidence"
      - name: Refuse invented SUT PASS
        run: |
          python - <<'PYCHECK'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'aqef-s5-report/report.json'
          r=json.loads(p.read_text())
          assert r['plan']['scope']=='partial'
          assert r['provenance']['cts_commit']==os.environ['GITHUB_SHA']
          assert r['provenance']['sut_name']=='Stage-C-Mock-Only'
          assert r['summary']['cases']['PASS']==0
          assert r['summary']['cases']['NOT_RUN']>0
          print('S5 truthful report PASS (no fabricated SUT claims)')
          PYCHECK
      - name: Regression S4.2 CLI
        run: cd conformance-tests/s4_cli && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S4.1 plugins
        run: cd conformance-tests/s4_plugins && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S4.0 human review
        run: cd conformance-tests/s4_human_review && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.5 closure
        run: cd conformance-tests/s355_closure && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.4 retrieval
        run: cd conformance-tests/s35_attribution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.3 timing
        run: cd conformance-tests/s35_timing && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.2 evidence
        run: cd conformance-tests/s35_evidence && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.1 governance
        run: cd conformance-tests/s35_resolution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.5.0 integration
        run: cd conformance-tests/s35_integration && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3.2 mutation
        run: cd conformance-tests/s3_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S3 decision
        run: cd conformance-tests/s3_decision && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.3 mutation
        run: cd conformance-tests/s2_mutation && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.2 assessment
        run: cd conformance-tests/s2_assessment && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S2.1 execution
        run: cd conformance-tests/s2_execution && python -m unittest discover -p 'test_*.py' -v
      - name: Regression S1/S2.0 configuration
        run: cd conformance-tests/s1_configuration && python -m unittest discover -p 'test_*.py' -v
      - name: Upload verified S5 partial report and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqef-s5-partial-mock-report-${{ github.sha }}
          path: ${{ runner.temp }}/aqef-s5-report/
          if-no-files-found: error
          retention-days: 30
