name: CTS Stage C.2.1 Traceability
on:
  push:
    paths:
      - 'conformance-tests/stage_c2/**'
      - '.github/workflows/cts-stage-c21-traceability.yml'
  pull_request:
    paths:
      - 'conformance-tests/stage_c2/**'
      - '.github/workflows/cts-stage-c21-traceability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normative validator dependencies
        run: python -m pip install 'jsonschema==4.23.0' 'referencing>=0.30' 'cryptography>=43,<47'
      - name: C.2.1–C.2.5 positive and negative tests
        run: python -m unittest discover -s conformance-tests/stage_c2 -p 'test_*.py' -v
      - name: C.2.5 account for C.1 immutable baseline regression
        run: |
          python conformance-tests/stage_c_closure/run_regression.py --out "$RUNNER_TEMP/c25" --sha "$GITHUB_SHA"
          python conformance-tests/stage_c2/regression_accounting.py \
            --regression "$RUNNER_TEMP/c25/regression.json" \
            --logs "$RUNNER_TEMP/c25/logs" \
            --output "$RUNNER_TEMP/c25/accounting.json"
